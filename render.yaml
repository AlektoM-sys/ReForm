services:
  - type: worker
    name: reformpsy-bot
    runtime: python
    rootDir: bot
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: FORMS_LINK
        sync: false
      - key: AGENYZ_LINK
        sync: false
